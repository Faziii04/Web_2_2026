<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doguito Petshop | Registro de pet</title>
    <link rel="icon" href="../assets/img/doguitoadm.svg" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/css/base/base.css" />
    <link rel="stylesheet" href="../assets/css/componentes/header.css" />
    <link rel="stylesheet" href="../assets/css/componentes/card.css" />
    <link rel="stylesheet" href="../assets/css/register_client.css" />
    <link rel="stylesheet" href="../assets/css/componentes/inputs.css" />
    <link rel="stylesheet" href="../assets/css/componentes/button.css" />
    <link rel="stylesheet" href="../assets/css/register_pet.css" />
  </head>
  <body>
    <header class="header container">
      <img
        src="../assets/img/doguitoadm.svg"
        alt="Logo Doguito"
        class="header__logo"
      />
      <nav>
        <ul class="header__list-nav">
          <li class="header__link"><a href="#">Dashboard</a></li>
          <li class="header__link"><a href="./registrar_producto.html">Productos</a></li>
          <li class="header__link"><a href="./lista_cliente.html">Clientes</a></li>
          <li class="header__link"><a href="./registrar_pet.html">Pets</a></li>
        </ul>
      </nav>
    </header>

    <main class="container flex flex--center flex--column">
      <section class="card cadastro">
        <h1 class="card__title">Registrar un pet</h1>
        <form class="flex flex--column" data-form>
          <div class="input-container register__half-container">
            <input
              name="nombre"
              id="nombre"
              class="input"
              type="text"
              placeholder="Nombre"
              required
              data-nombre
            />
            <label class="input-label" for="nombre">Nombre</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>

          <div class="input-container register__half-container">
            <input
              name="especie"
              id="especie"
              class="input"
              type="text"
              placeholder="Especie"
              required
              data-especie
            />
            <label class="input-label" for="especie">Especie</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>

          <div class="input-container register__half-container">
            <input
              name="raza"
              id="raza"
              class="input"
              type="text"
              placeholder="Raza"
              required
              data-raza
            />
            <label class="input-label" for="raza">Raza</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>

          <div class="input-container register__half-container">
            <input
              name="edad"
              id="edad"
              class="input"
              type="number"
              min="0"
              placeholder="Edad"
              required
              data-edad
            />
            <label class="input-label" for="edad">Edad</label>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>

          <div class="input-container register__half-container">
            <label class="select-label" for="cliente">Cliente</label>
            <select name="cliente" id="cliente" class="select" data-cliente required>
                <option value="" disabled selected class="select-placeholder">Selecciona un cliente</option>
            </select>
            <span class="input-menssage-error">Este campo es requerido</span>
          </div>

          <div class="textarea-container register_description-container">
            <textarea
              class="textarea register_description"
              name="notas"
              id="notas"
              placeholder="Notas"
              data-notas
            ></textarea>
            <label class="textarea-label" for="notas">Notas</label>
            <span class="textarea-menssage-error">Este campo es requerido</span>
          </div>

          <button type="submit" class="button">Registrar pet</button>
        </form>
      </section>
    </main>

    <script src="../controllers/registrar_pet.controller.js" type="module"></script>
  </body>
</html>
