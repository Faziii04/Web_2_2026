<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <form class="form" id="registration-form">
            <h1>Crear cuenta</h1>
            <p class="form-subtitle">Unite ya!</p>

            <div class="form-group">
                <label for="name">Nombre/s (al reves)</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirmar contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono (sin números)</label>
                <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
            </div>

            <div class="form-group">
                <label for="address">Dirección (SOLO MAYÚSCULAS y sin espacios)</label>
                <input type="text" id="address" name="address" placeholder="123 Main Street" required>
            </div>

            <div class="form-group">
                <label for="age">Edad (letras, por favor)</label>
                <input type="text" id="age" name="age" placeholder="25" required>
            </div>

            <div class="form-group checkbox">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">Acepto los terminos y condiciones</label>
            </div>

            <button type="submit" class="btn-submit">Crear cuenta</button>

            <p class="form-footer">Already have an account? <a href="#">Sign in</a></p>
        </form>
    </div>
    <script src="script.js" type="module"></script>
</body>
</html>
